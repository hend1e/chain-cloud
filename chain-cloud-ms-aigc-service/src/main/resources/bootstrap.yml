application:
  version: v1.0
logging:
  config: classpath:logback-spring.xml
spring:
  application:
    name: chain-cloud-ms-aigc
  profiles:
    active: local
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  main:
    allow-circular-references: true
feign:
  client:
    config:
      default:
        connect-timeout: 10000
        read-timeout: 1000000
cc:
  swagger:
    package-path: com.itheima.ms.aigc.controller
    title: 智链云途 - AIGC微服务接口文档
    description: 该微服务完成AI相关的业务服务。
    contact-name: 传智教育·研究院
    contact-url: http://www.itcast.cn/
    contact-email: yjy@itcast.cn
    version: ${application.version}
